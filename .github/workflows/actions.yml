# 이름 짓기
name: Github Actions 연습하기
# 언제 이 워크플로우가 실행될지
# github에 push할 때 실행하겠다.
on: push

# 직업 설정
jobs:
  push-job: # 직업 이름
    # 컴퓨터 환경 설정
    runs-on: ubuntu-latest
    steps:
      - name: 첫 번째 작업
        run: echo "첫 번째 작업 실행 중"

      - name: 두 번째 작업
        run: |
          echo "두 번째 작업 실행 중 1"
          echo "두 번째 작업 실행 중 2"

      - name: Github Actions 내장 변수 사용하기
        run: |
          echo $GITHUB_SHA
          echo $GITHUB_REPOSITORY

      - name: Github Actions Secret 변수 사용하기
        run: |
          echo ${{ secrets.MY_NAME }}
          echo ${{ secrets.MY_HOBBY }}
